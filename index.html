<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iglesia Casa de Gracia</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/img/logo-cdg-sin-fondo.png">

  <!-- Archivo manifest para instalación como PWA / Acceso directo -->
  <link rel="manifest" href="/manifest.json">

  <!-- Favicon estándar para pestañas del navegador -->
  <link rel="icon" type="image/png" href="assets/img/icon-192.png">

  <!-- Ícono específico para iPhone / iOS -->
  <link rel="apple-touch-icon" href="assets/img/icon-192.png">

  <!-- Color de la barra del navegador en Android -->
  <meta name="theme-color" content="#0f172a">

  <!-- Ocultar la advertencia del CDN en consola -->
  <script>
    window.tailwind = { config: { suppressDeprecationWarnings: true } };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Estilos Personalizados -->
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans overflow-x-hidden">

  <!-- NAVBAR RESPONSIVA -->
  <header class="sticky top-0 z-50 bg-gradient-to-r from-sky-950 via-blue-900 to-slate-950 border-b border-sky-500/30 shadow-2xl backdrop-blur-md bg-opacity-95 py-3">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-3">
      
      <!-- LOGO Y TÍTULOS -->
      <div class="flex items-center space-x-3 w-full sm:w-auto justify-between sm:justify-start">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 sm:w-14 sm:h-14 rounded-full overflow-hidden border-2 border-sky-300/40 shadow-lg shadow-sky-500/30 flex-shrink-0 bg-sky-500 flex items-center justify-center">
            <img 
              src="assets/img/logo-cdg-sin-fondo.png" 
              alt="Logo Iglesia Casa de Gracia" 
              class="w-full h-full object-cover scale-110"
            />
          </div>
          
          <div class="flex flex-col">
            <h1 class="text-lg sm:text-2xl font-extrabold tracking-tight text-white drop-shadow-sm leading-tight">
              Iglesia Casa de Gracia
            </h1>
            <span class="text-[10px] sm:text-xs font-semibold text-sky-200 italic bg-sky-500/20 border border-sky-400/40 px-2 py-0.5 rounded-full inline-block mt-0.5 w-max">
              Fuente de Vida
            </span>
          </div>
        </div>

        <!-- REDES SOCIALES (Versión Mobile) -->
        <div class="flex items-center space-x-2 sm:hidden">
          <a href="https://facebook.com/casa.degracia.1" target="_blank" rel="noopener noreferrer" class="w-8 h-8 rounded-xl bg-slate-900/80 border border-slate-700/60 p-1.5 flex items-center justify-center">
            <img src="assets/img/Facebook_Logo.png" alt="Facebook" class="w-full h-full object-contain" />
          </a>
          <a href="https://www.instagram.com/casadegracia_fuentedevida" target="_blank" rel="noopener noreferrer" class="w-8 h-8 rounded-xl bg-slate-900/80 border border-slate-700/60 p-1.5 flex items-center justify-center">
            <img src="assets/img/Instagram_logo.png" alt="Instagram" class="w-full h-full object-contain" />
          </a>
          <a href="https://youtube.com/@CasadeGracia-FuentedeVida" target="_blank" rel="noopener noreferrer" class="w-8 h-8 rounded-xl bg-slate-900/80 border border-slate-700/60 p-1.5 flex items-center justify-center">
            <img src="assets/img/Youtube_logo.png" alt="YouTube" class="w-full h-full object-contain" />
          </a>
        </div>
      </div>

      <!-- REDES SOCIALES (Versión Desktop) -->
      <div class="hidden sm:flex items-center space-x-3">
        <a href="https://facebook.com/casa.degracia.1" target="_blank" rel="noopener noreferrer" class="w-10 h-10 rounded-2xl bg-slate-900/80 border border-slate-700/60 p-2 flex items-center justify-center hover:scale-110 hover:border-blue-500/50 transition-all duration-300">
          <img src="assets/img/Facebook_Logo.png" alt="Facebook" class="w-full h-full object-contain" />
        </a>
        <a href="https://www.instagram.com/casadegracia_fuentedevida" target="_blank" rel="noopener noreferrer" class="w-10 h-10 rounded-2xl bg-slate-900/80 border border-slate-700/60 p-2 flex items-center justify-center hover:scale-110 hover:border-pink-500/50 transition-all duration-300">
          <img src="assets/img/Instagram_logo.png" alt="Instagram" class="w-full h-full object-contain" />
        </a>
        <a href="https://youtube.com/@CasadeGracia-FuentedeVida" target="_blank" rel="noopener noreferrer" class="w-10 h-10 rounded-2xl bg-slate-900/80 border border-slate-700/60 p-2 flex items-center justify-center hover:scale-110 hover:border-red-500/50 transition-all duration-300">
          <img src="assets/img/Youtube_logo.png" alt="YouTube" class="w-full h-full object-contain" />
        </a>
      </div>

    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-10">
    
    <!-- SECCIÓN ANUNCIOS -->
    <section class="space-y-4">
      <h2 class="text-xl sm:text-2xl font-bold text-white flex items-center gap-2">
        <span class="w-2 h-6 bg-sky-500 rounded-full inline-block"></span>
        Anuncios
      </h2>

      <div class="relative group rounded-2xl sm:rounded-3xl overflow-hidden border border-slate-800 bg-slate-900/50 shadow-2xl backdrop-blur-xl max-w-4xl mx-auto">
        <div id="carousel-slides" class="flex transition-transform duration-700 ease-out w-full">
          <!-- Inyectado mediante JS -->
        </div>

        <!-- Flechas del carrusel -->
        <button id="btn-prev" class="hidden sm:flex absolute left-2 sm:left-4 top-1/2 -translate-y-1/2 p-2 sm:p-3 rounded-full bg-slate-950/70 text-white border border-slate-700/50 backdrop-blur-md transition-all duration-300 hover:bg-sky-500 hover:border-sky-400 z-20">
          <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
          </svg>
        </button>

        <button id="btn-next" class="hidden sm:flex absolute right-2 sm:right-4 top-1/2 -translate-y-1/2 p-2 sm:p-3 rounded-full bg-slate-950/70 text-white border border-slate-700/50 backdrop-blur-md transition-all duration-300 hover:bg-sky-500 hover:border-sky-400 z-20">
          <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7" />
          </svg>
        </button>
      </div>
    </section>

    <!-- SECCIÓN BIBLIA -->
    <section class="space-y-4">
      <h2 class="text-xl sm:text-2xl font-bold text-white flex items-center gap-2">
        <span class="w-2 h-6 bg-sky-500 rounded-full inline-block"></span>
        Biblia
      </h2>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <button 
          type="button"
          id="btn-antiguo-testamento"
          class="w-full py-4 sm:py-5 px-6 rounded-2xl bg-slate-900 border border-slate-800 text-slate-100 font-bold text-base sm:text-xl shadow-lg hover:border-sky-500/50 hover:bg-slate-800/80 transition-all duration-300 flex items-center justify-center gap-3 group"
        >
          <svg class="w-6 h-6 text-sky-400 group-hover:scale-110 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
          </svg>
          Antiguo Testamento
        </button>

        <button 
          type="button"
          id="btn-nuevo-testamento"
          class="w-full py-4 sm:py-5 px-6 rounded-2xl bg-slate-900 border border-slate-800 text-slate-100 font-bold text-base sm:text-xl shadow-lg hover:border-sky-500/50 hover:bg-slate-800/80 transition-all duration-300 flex items-center justify-center gap-3 group"
        >
          <svg class="w-6 h-6 text-sky-400 group-hover:scale-110 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
          </svg>
          Nuevo Testamento
        </button>
      </div>
    </section>

    <!-- SECCIÓN PRÉDICAS Y FILTROS -->
    <section class="space-y-6">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-800">
        <div>
          <h2 class="text-xl sm:text-2xl font-bold text-white flex items-center gap-2">
            <span class="w-2 h-6 bg-sky-500 rounded-full inline-block"></span>
            Prédicas
          </h2>
        </div>

        <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
          <div class="relative flex-1 sm:w-64">
            <input
              id="input-busqueda"
              type="text"
              placeholder="Buscar prédica..."
              class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-xl px-4 py-2.5 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition-colors"
            />
          </div>

          <div class="flex items-center justify-between sm:justify-start gap-2 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2">
            <label for="select-orden" class="text-xs text-slate-400 font-medium whitespace-nowrap">Ordenar por:</label>
            <select
              id="select-orden"
              class="bg-transparent text-sm text-sky-300 font-medium focus:outline-none cursor-pointer"
            >
              <option value="fecha-desc" class="bg-slate-900 text-slate-200">Más recientes primero</option>
              <option value="fecha-asc" class="bg-slate-900 text-slate-200">Más antiguas primero</option>
              <option value="titulo-asc" class="bg-slate-900 text-slate-200">Título (A - Z)</option>
              <option value="titulo-desc" class="bg-slate-900 text-slate-200">Título (Z - A)</option>
            </select>
          </div>
        </div>
      </div>

      <div id="grid-predicas" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Inyectado mediante JS -->
      </div>
    </section>

  </main>

  <!-- MODAL PRÉDICA -->
  <div id="modal-predica" class="fixed inset-0 z-50 hidden bg-slate-950/95 backdrop-blur-xl p-0 sm:p-4 md:p-6 flex items-center justify-center">
    <div class="bg-slate-900 border border-slate-800 sm:rounded-3xl w-full h-full flex flex-col overflow-hidden shadow-2xl relative">

      <div class="grid grid-cols-1 lg:grid-cols-12 h-full w-full overflow-y-auto lg:overflow-hidden">
        
        <!-- COLUMNA IZQUIERDA: VIDEO YOUTUBE -->
        <div class="lg:col-span-7 bg-black flex items-center justify-center min-h-[250px] lg:h-full">
          <div id="modal-video-container" class="w-full h-full aspect-video lg:aspect-auto">
            <!-- Iframe inyectado por JS -->
          </div>
        </div>

        <!-- COLUMNA DERECHA: INFORMACIÓN Y APUNTES -->
        <div class="lg:col-span-5 p-6 lg:p-8 flex flex-col justify-between space-y-6 lg:h-full lg:overflow-y-auto bg-slate-900">
          <div class="space-y-6">
            
            <!-- CABECERA: Predicador, Fecha y Botón 'X' integrados en el mismo contenedor flex -->
            <div class="flex items-center justify-between gap-2 pb-2 border-b border-slate-800/60">
              <span id="modal-predicador" class="text-xs sm:text-sm font-semibold px-3 py-1 rounded-lg bg-sky-500/10 text-sky-400 border border-sky-500/20 truncate">
                <!-- Predicador -->
              </span>

              <div class="flex items-center gap-2 flex-shrink-0">
                <span id="modal-fecha" class="text-xs sm:text-sm font-medium text-amber-400 bg-amber-400/10 px-3 py-1 rounded-lg border border-amber-400/20 whitespace-nowrap">
                  <!-- Fecha -->
                </span>

                <!-- Botón de Cierre 'X' integrado en la misma barra -->
                <button 
                  id="btn-cerrar-modal-predica" 
                  class="p-1.5 sm:p-2 rounded-xl bg-slate-800 text-slate-300 hover:text-white hover:bg-sky-500 transition-all flex items-center justify-center"
                  title="Cerrar modal"
                >
                  <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
                  </svg>
                </button>
              </div>
            </div>

            <h3 id="modal-titulo" class="text-xl sm:text-2xl font-extrabold text-white leading-tight">
              <!-- Título -->
            </h3>

            <div class="space-y-3">
              <h4 class="text-xs sm:text-sm font-bold text-sky-300 flex items-center gap-2 uppercase tracking-wider">
                Resumen y Apuntes
              </h4>
              <div id="modal-apuntes" class="p-4 rounded-2xl bg-slate-950/80 border border-slate-800 text-sm sm:text-base text-slate-300 whitespace-pre-line leading-relaxed">
                <!-- Apuntes -->
              </div>
            </div>
          </div>

          <div class="pt-4 border-t border-slate-800 flex justify-end">
            <button id="btn-cerrar-bottom" onclick="document.getElementById('btn-cerrar-modal-predica').click()" class="w-full sm:w-auto px-6 py-2.5 bg-slate-800 hover:bg-slate-700 text-white font-semibold rounded-xl transition-colors text-sm">
              Cerrar Vista
            </button>
          </div>
        </div>

      </div>

    </div>
  </div>

  <!-- MODAL BIBLIA -->
  <div id="modal-biblia" class="fixed inset-0 z-50 hidden bg-slate-950/95 backdrop-blur-xl pt-8 px-4 pb-4 sm:p-6 flex items-start sm:items-center justify-center overflow-y-auto">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-4xl max-h-[85vh] sm:max-h-[90vh] flex flex-col overflow-hidden shadow-2xl relative my-auto sm:my-0">
      <div class="p-5 border-b border-slate-800 flex items-center justify-between">
        <h3 id="biblia-modal-titulo" class="text-xl font-bold text-white flex items-center gap-3">
          <span id="biblia-titulo-texto">Libros</span>
        </h3>
        <button id="btn-cerrar-biblia" class="p-2 rounded-full bg-slate-800 text-slate-400 hover:text-white hover:bg-sky-500 transition-all">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div id="contenedor-busqueda-biblia" class="px-5 pt-3 pb-2 border-b border-slate-800/60">
        <input 
          type="text" 
          id="input-buscar-libro" 
          placeholder="Buscar libro" 
          class="w-full px-4 py-2 bg-slate-950/80 border border-slate-800 rounded-xl text-white text-sm focus:outline-none focus:border-sky-500"
        />
      </div>

      <div id="grid-libros" class="p-5 overflow-y-auto grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 max-h-[calc(85vh-180px)] sm:max-h-[calc(90vh-180px)]">
        <!-- Inyectado por JS -->
      </div>
    </div>
  </div>

  <!-- ENTRY POINT JS (ES MODULE) -->
  <script type="module" src="assets/js/modules/app.js"></script>

</body>
</html>
